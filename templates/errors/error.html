{% extends 'base.html' %}
{% from '_macros.html' import icon %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="error-box">
  <div class="code num">{{ code }}</div>
  <h1 class="mb-sm">{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="row justify-center mt-1">
    <a class="btn btn-primary" href="{{ url_for('dashboard.home') if current_user.is_authenticated else url_for('auth.login') }}">{{ icon('home') }} {{ t('العودة للرئيسية','Back home') }}</a>
  </div>
</div>
{% endblock %}
